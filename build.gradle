plugins {
id 'com.android.application'
id 'kotlin-android'
id 'kotlin-kapt'
id 'com.google.gms.google-services'   // если Firebase не используется, удалите эту строку и плагин
}

android {
namespace 'com.my.mealse'
compileSdk 34

defaultConfig {
applicationId "com.my.mealse"
minSdk 29
targetSdk 34
versionCode 1
versionName "1.0"
renderscriptTargetApi 18
renderscriptSupportModeEnabled true
}

buildFeatures {
viewBinding true
}

buildTypes {
debug {
buildConfigField "boolean", "DEBUG", "true"
}
release {
buildConfigField "boolean", "DEBUG", "false"
minifyEnabled true
proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}
}

compileOptions {
sourceCompatibility JavaVersion.VERSION_11
targetCompatibility JavaVersion.VERSION_11
}

kotlinOptions {
jvmTarget = "11"
}

packagingOptions {
resources {
excludes += [
'LICENSE', 'LICENSE.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ASL2.0',
'META-INF/DEPENDENCIES'
]
pickFirsts += ['LICENSE']
}
}
}

dependencies {
// UI
implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
implementation 'androidx.cardview:cardview:1.0.0'
implementation 'androidx.recyclerview:recyclerview:1.3.2'
implementation 'com.google.android.material:material:1.4.0'   // старая стабильная версия
implementation 'androidx.viewpager2:viewpager2:1.1.0-alpha01'
implementation 'com.getbase:floatingactionbutton:1.10.1'
implementation 'com.github.hannes2:AndroidSlidingUpPanel:3.5.0'

// Images
implementation 'com.github.bumptech.glide:glide:4.11.0'
kapt 'com.github.bumptech.glide:compiler:4.11.0'
implementation 'com.github.square:Picasso:2.71828'

// Network & Parsing
implementation 'com.squareup.okhttp3:okhttp:4.12.0'
implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
implementation 'com.google.code.gson:gson:2.10.1'
implementation 'org.jsoup:jsoup:1.17.2'

// Room
def room_version = "2.6.0"
implementation "androidx.room:room-runtime:$room_version"
implementation "androidx.room:room-ktx:$room_version"
kapt "androidx.room:room-compiler:$room_version"
testImplementation "androidx.room:room-testing:$room_version"

// Google & Firebase (если используете)
implementation 'com.google.android.gms:play-services-auth:20.7.0'
implementation 'com.google.android.gms:play-services-base:18.3.0'
implementation 'com.google.firebase:firebase-core:19.0.1'
implementation 'com.google.firebase:firebase-auth:21.0.1'
implementation 'com.google.firebase:firebase-database:20.0.2'
implementation 'com.google.firebase:firebase-storage:20.0.0'
implementation 'net.openid.appauth:appauth:0.11.1'
    
// Security
implementation 'androidx.security:security-crypto:1.1.0-alpha06'

// WebView
implementation 'androidx.webkit:webkit:1.9.0'

// Utils
implementation 'com.jakewharton.timber:timber:5.0.1'
implementation 'javax.annotation:javax.annotation-api:1.3.2'
implementation 'io.dropwizard.metrics:metrics-core:4.2.20'

// FFmpeg
implementation 'com.arthenica:ffmpeg-kit-full:6.1'
implementation 'com.arthenica:ffmpeg-kit-min:6.0-2'
// Testing
testImplementation 'junit:junit:4.13.2'
testImplementation 'org.mockito:mockito-core:5.3.1'
androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
implementation fileTree(dir: 'libs', include: ['*.aar'])
}

kapt {
correctErrorTypes true
}